
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: my-java-app:latest
    container_name: my-java-app

    ports:
      - "8081:8080"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
